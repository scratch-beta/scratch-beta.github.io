name: Build and Deploy Scratch GUI to Pages

on:
  # Allows manual triggers from the Actions tab
  workflow_dispatch:

# Set permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build root and packages
        run: npm run build

      - name: Build Scratch GUI static bundle
        run: npm run build --workspace=packages/scratch-gui
        continue-on-error: true # Falls back to the root build step if workspace script is not separate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Points to the static build output inside the scratch-gui package
          path: './packages/scratch-gui/build' 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
